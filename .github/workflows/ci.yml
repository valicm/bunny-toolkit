name: CI

on:
  push:
    branches: ['[0-9]+.x']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.3'
            dependencies: lowest
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    services:
      # RedisTokenBucket's integration tests.
      valkey:
        image: valkey/valkey:8.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: composer validate --strict
      - name: Generated code matches specs/ and the API lock
        run: composer generate && git diff --exit-code -- src/Api generator/api.lock.json
      - run: composer cs
      - run: composer phpstan
      - run: composer test
        env:
          BUNNY_TOOLKIT_REDIS: tcp://127.0.0.1:6379
